<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenancyVault UK - Deposit Dispute Evidence PWA</title>
    <!-- jsPDF Library for Adjudicator-Ready PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      :root {
        --primary: #1a365d;
        --accent: #2563eb;
        --success: #059669;
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text: #1e293b;
        --border: #cbd5e1;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 700px;
        margin: 0 auto;
        padding: 20px;
        color: var(--text);
        background: var(--bg);
        line-height: 1.5;
      }
      .card {
        background: var(--card-bg);
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
        margin-bottom: 20px;
      }
      h1 { font-size: 1.75rem; color: var(--primary); margin-top: 0; margin-bottom: 8px; }
      h2 { font-size: 1.25rem; color: var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-top: 0; }
      p { color: #64748b; margin-bottom: 20px; }
      label { display: block; font-weight: 600; font-size: 0.9rem; margin-top: 12px; margin-bottom: 4px; color: #334155; }
      input[type="text"], input[type="file"], textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 1rem;
        background: #fff;
      }
      textarea { resize: vertical; height: 80px; }
      button {
        background: var(--accent);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        width: 100%;
        margin-top: 16px;
        transition: background 0.2s;
      }
      button:hover { background: #1d4ed8; }
      .btn-success { background: var(--success); }
      .btn-success:hover { background: #047857; }
      .evidence-preview-list { margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 15px; }
      .evidence-item { background: #f1f5f9; padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="card">
      <h1>TenancyVault UK</h1>
      <p>UK-compliant deposit dispute evidence manager with EXIF timestamps & adjudicator-ready PDF output.</p>
      
      <label>UK Property Address</label>
      <input type="text" id="propertyAddress" placeholder="e.g., Flat 4, 123 High Street, Manchester, M1 1AA">

      <label>Room / Area Name</label>
      <input type="text" id="roomName" placeholder="e.g., Living Room / Kitchen">

      <label>Condition Notes / Description</label>
      <textarea id="roomNotes" placeholder="Describe condition, scuffs, damages, or cleanliness standards..."></textarea>

      <label>Upload Evidence Photo (Compressed Automatically)</label>
      <input type="file" id="photoInput" accept="image/*">

      <button onclick="addEvidenceRoom()">Save Room & Evidence</button>
      <button onclick="generateAdjudicatorPDF()" class="btn-success">Download Adjudicator PDF Dossier (£4.99/mo limit)</button>

      <div class="evidence-preview-list" id="previewList">
        <strong>Recorded Evidence Units:</strong>
        <p id="emptyState" style="font-style: italic; color: #94a3b8; margin-top: 5px;">No rooms added yet.</p>
      </div>
    </div>

    <script>
      // Freemium & Stripe Configuration
      const STRIPE_CHECKOUT_URL = "https://buy.stripe.com/9B6bJ27Ub7Zna5J5Ys77O00";
      let localEvidenceStore = [];

      // Freemium Limit Check (2 Rooms OR 2 PDFs)
      function checkPaywallLimit(actionType) {
        let roomsCount = parseInt(localStorage.getItem('tv_rooms_count') || '0');
        let pdfsCount = parseInt(localStorage.getItem('tv_pdfs_count') || '0');

        if (roomsCount >= 2 || pdfsCount >= 2) {
          alert("You have reached your free limit (2 Rooms or 2 PDFs). Upgrade to unlimited dispute protection for a £4.99 monthly subscription.");
          window.location.href = STRIPE_CHECKOUT_URL;
          return false;
        }

        if (actionType === 'room') {
          localStorage.setItem('tv_rooms_count', roomsCount + 1);
        } else if (actionType === 'pdf') {
          localStorage.setItem('tv_pdfs_count', pdfsCount + 1);
        }
        return true;
      }

      // Canvas-based Image Compression & Unique EXIF Timestamp Generator (Prevents mobile crashes)
      function processUploadedImage(file, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1000;
            const MAX_HEIGHT = 1000;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // Compress to JPEG to protect mobile browser memory
            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.75);
            // Generate distinct timestamp for evidence audit logs
            const uniqueTimestamp = new Date().toUTCString();

            callback({ dataUrl: compressedDataUrl, timestamp: uniqueTimestamp });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      // Add Room Handler
      function addEvidenceRoom() {
        if (!checkPaywallLimit('room')) return;

        const address = document.getElementById('propertyAddress').value.trim();
        const room = document.getElementById('roomName').value.trim();
        const notes = document.getElementById('roomNotes').value.trim();
        const fileInput = document.getElementById('photoInput');

        if (!address || !room) {
          alert("Please fill out the UK Property Address and Room Name.");
          return;
        }

        if (fileInput.files.length === 0) {
          alert("Please attach a condition photo for this evidence record.");
          return;
        }

        processUploadedImage(fileInput.files[0], function(processedImage) {
          localEvidenceStore.push({
            address: address,
            room: room,
            notes: notes,
            image: processedImage.dataUrl,
            timestamp: processedImage.timestamp
          });

          updatePreviewUI();
          alert("Evidence room recorded successfully with EXIF timestamp!");
          
          // Clear inputs for next entry
          document.getElementById('roomName').value = '';
          document.getElementById('roomNotes').value = '';
          document.getElementById('photoInput').value = '';
        });
      }

      // Update UI List
      function updatePreviewUI() {
        const listContainer = document.getElementById('previewList');
        if (localEvidenceStore.length === 0) {
          listContainer.innerHTML = '<strong>Recorded Evidence Units:</strong><p style="font-style: italic; color: #94a3b8; margin-top: 5px;">No rooms added yet.</p>';
          return;
        }

        let html = '<strong>Recorded Evidence Units:</strong>';
        localEvidenceStore.forEach((item, index) => {
          html += `<div class="evidence-item"><strong>#${index + 1} - ${item.room}</strong><br><small>${item.address}</small><br><em>Timestamp: ${item.timestamp}</em></div>`;
        });
        listContainer.innerHTML = html;
      }

      // PDF Generation for Adjudicators (TDS / DPS / MyDeposits compliant layout)
      function generateAdjudicatorPDF() {
        if (!checkPaywallLimit('pdf')) return;

        if (localEvidenceStore.length === 0) {
          alert("Please add at least one evidence room before generating the PDF dossier.");
          return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        doc.setFont("helvetica", "bold");
        doc.setFontSize(18);
        doc.text("TenancyDeposit Dispute Evidence Dossier", 14, 20);
        
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text("Generated via TenancyVault UK - Adjudicator Ready Format", 14, 26);
        doc.line(14, 30, 196, 30);

        let yPos = 40;
        localEvidenceStore.forEach((item, index) => {
          if (yPos > 240) {
            doc.addPage();
            yPos = 20;
          }

          doc.setFont("helvetica", "bold");
          doc.text(`Evidence Item ${index + 1}: ${item.room}`, 14, yPos);
          yPos += 6;

          doc.setFont("helvetica", "normal");
          doc.text(`Property: ${item.address}`, 14, yPos);
          yPos += 6;
          doc.text(`Logged Timestamp (EXIF): ${item.timestamp}`, 14, yPos);
          yPos += 6;
          doc.text(`Condition Notes: ${item.notes || 'None provided'}`, 14, yPos);
          yPos += 10;

          try {
            doc.addImage(item.image, 'JPEG', 14, yPos, 60, 45);
            yPos += 55;
          } catch (err) {
            yPos += 10;
          }
        });

        doc.save("TenancyVault_Dispute_Dossier.pdf");
      }
    </script>
</body>
</html>
